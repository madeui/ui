<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 -1.05 59.05 59.05" width="48" height="48">
  <!-- Three placed components and one still snapping into its slot.
       All currentColor, so the mark follows the page ink in both modes.
       The viewBox is the mark's true bounding box (the tilted slot overshoots
       the 64-unit grid), so the mark fills its box with no baked-in padding. -->
  <rect x="6" y="6" width="24" height="24" rx="7" fill="currentColor"/>
  <rect x="6" y="34" width="24" height="24" rx="7" fill="currentColor"/>
  <rect x="34" y="34" width="24" height="24" rx="7" fill="currentColor"/>
  <rect x="38" y="2" width="24" height="24" rx="7" fill="none" stroke="currentColor"
      stroke-width="3" stroke-dasharray="5 4" stroke-linecap="round"
      transform="rotate(8 50 14)"/>
</svg>
