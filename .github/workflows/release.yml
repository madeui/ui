name: Release

# Push a tag, get a release. The tag is the trigger and the source of
# truth for the version:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# npm auth comes from OIDC (trusted publishing), configured per package on
# npmjs.com — no NPM_TOKEN lives in this repo.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing

jobs:
  release:
    name: Publish @madeui/cli and cut the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated by diffing against the previous
          # tag, which a shallow clone doesn't have.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 22 still ships npm 10.
      - run: npm install -g npm@latest

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match @madeui/cli@$pkg" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Registry JSON must match the committed output
        run: |
          node packages/registry/scripts/build-registry.mjs
          git diff --exit-code packages/registry/public/r

      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
