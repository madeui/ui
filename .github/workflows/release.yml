name: Release

# Publishes @madeui/cli with Changesets. Nothing else in this repo is
# versioned: the registry and the docs site deploy continuously from main
# (Vercel), so a component merge is live within minutes and needs no release.
#
# How a CLI release happens:
#   1. A PR that touches packages/cli adds a changeset (`pnpm changeset`).
#   2. On merge, this workflow opens or updates the "Version Packages" PR,
#      which bumps packages/cli/package.json and writes its CHANGELOG.md.
#   3. Merging that PR runs `changeset publish`: npm publish + git tag
#      `@madeui/cli@x.y.z` + a GitHub release with the changelog entry.
#
# Snapshot (try a PR before it merges): Actions → Release → "Run workflow",
# pick the branch. Publishes `@madeui/cli@0.0.0-<tag>-<timestamp>` under the
# npm dist-tag given as input (default `beta`), with no git tag, no GitHub
# release, and `latest` untouched. Install it with `npx @madeui/cli@beta`.
# The branch must carry a changeset for @madeui/cli, otherwise there is
# nothing to version and nothing is published.
#
# npm auth comes from OIDC (trusted publishing), configured for @madeui/cli
# on npmjs.com against this workflow file — no NPM_TOKEN lives in this repo.
# pnpm 11 talks to the registry natively (`info` and `publish`, OIDC
# included), so the npm CLI is not involved. Don't reintroduce
# `npm install -g npm@latest` or setup-node's `registry-url`: npm 12 changed
# `npm view --json` to return an array, which breaks `changeset publish`
# when pnpm delegates to it, and `registry-url` plants a placeholder
# NODE_AUTH_TOKEN that pnpm has to override.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag for the snapshot (never `latest`)
        default: beta
        required: true

# One release run at a time; a second push waits instead of racing the
# Version Packages PR update.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # push the version commit, tags, and the GitHub release
  pull-requests: write # open/update the Version Packages PR
  id-token: write # npm trusted publishing

jobs:
  release:
    name: Version Packages PR or publish @madeui/cli
    if: github.repository == 'madeui/ui' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Changesets needs history to find the base branch and prior tags.
          fetch-depth: 0
      # pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create the Version Packages PR, or publish if it was merged
        uses: changesets/action@fdf536a68c4154480c89b42547f8102cf0d8bc47 # v2.1.1
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    name: Publish a snapshot of @madeui/cli
    if: github.repository == 'madeui/ui' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse to snapshot onto `latest`
        if: inputs.tag == 'latest'
        run: echo "::error::snapshots must not use the latest dist-tag" && exit 1

      # Rewrites packages/cli/package.json to 0.0.0-<tag>-<timestamp> from the
      # changesets on this branch. Nothing is committed.
      - name: Version the snapshot
        run: pnpm changeset version --snapshot ${{ inputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish under the dist-tag
        run: pnpm changeset publish --tag ${{ inputs.tag }} --no-git-tag

      - name: Report the version
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          echo "Published @madeui/cli@$version (dist-tag ${{ inputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Try it: npx @madeui/cli@${{ inputs.tag }} init" >> "$GITHUB_STEP_SUMMARY"
