name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  registry:
    name: Registry JSON is generated from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/registry/scripts/build-registry.mjs
      - name: Registry JSON must match the committed output
        run: git diff --exit-code packages/registry/public/r

  playground:
    name: Playground typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # next build first: it generates the route types (LayoutProps etc.)
      # that the standalone tsc pass then checks against.
      - run: pnpm --filter playground build
      - run: pnpm --filter playground exec tsc --noEmit

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @madeui/docs build

  changeset:
    name: CLI changes carry a changeset
    # Only meaningful on PRs; the Version Packages PR consumes changesets
    # by design, so it is exempt.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: packages/cli changed → a .changeset/*.md must be added
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed="$(git diff --name-only "origin/$BASE...HEAD")"
          if ! printf '%s\n' "$changed" | grep -q '^packages/cli/'; then
            echo "No CLI changes; nothing to check."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -v '^\.changeset/README\.md$' | grep -q '^\.changeset/.*\.md$'; then
            echo "CLI changes and a changeset found."
            exit 0
          fi
          {
            echo "This PR changes packages/cli but adds no changeset."
            echo "Run 'pnpm changeset', pick @madeui/cli and a bump level,"
            echo "write the release note, and commit the generated .changeset/*.md file."
          } >&2
          exit 1
