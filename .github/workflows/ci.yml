name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry:
    name: Registry JSON is generated from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/registry/scripts/build-registry.mjs
      - name: Registry JSON must match the committed output
        run: git diff --exit-code packages/registry/public/r

  playground:
    name: Playground typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/playground/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ui-lib/docs build
